# Enhanced Build and Deploy to EC2
# ==================================
name: Build and Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================================
  # Job 1: Build, Test & Push
  # ========================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      # ✅ Validate Dockerfile before building
      - name: 🔍 Validate Dockerfile
        run: |
          echo "::group::Dockerfile Validation"

          if ! grep -q "FROM.*AS production" Dockerfile; then
            echo "::error::Production target not found in Dockerfile"
            exit 1
          fi

          if ! grep -A 10 "FROM.*AS production" Dockerfile | grep -q "EXPOSE 3000"; then
            echo "::warning::Production stage might be missing EXPOSE directive"
          fi

          if ! grep -A 20 "FROM.*AS production" Dockerfile | grep -q "HEALTHCHECK"; then
            echo "::warning::Production stage is missing HEALTHCHECK"
          fi

          echo "✅ Dockerfile validation passed"
          echo "::endgroup::"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Normalize image name (lowercase)
      - name: 🔤 Normalize image name
        id: image
        run: |
          echo "name=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=git-,format=short
            type=raw,value=prod-{{date 'YYYYMMDD-FOOTOOSEmmss'}},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=FootlooseAdventures API
            org.opencontainers.image.description=Node.js Express API for FootlooseAdventures
            org.opencontainers.image.vendor=FootlooseAdventures
            org.opencontainers.image.created={{date 'YYYY-MM-DDTFOOTLOOSE:mm:ssZ'}}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: 🏗️ Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            BUILDKIT_INLINE_CACHE=1
          provenance: false

      # ✅ Verify the built image
      - name: 🔬 Verify image
        run: |
          echo "::group::Image Verification"

          docker pull ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest

          echo "📦 Image size:"
          docker images ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest --format "{{.Size}}"

          echo "🏥 Healthcheck:"
          docker inspect ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest --format='{{json .Config.Healthcheck}}' | jq '.' || echo "No healthcheck"

          echo "✅ Image verification passed"
          echo "::endgroup::"

      - name: 📊 Build summary
        if: success()
        run: |
          echo "## Docker Build Summary 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** $(docker images ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest --format '{{.Size}}')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags Published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ========================================
  # Job 2: Deploy to EC2
  # ========================================
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🚀 Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app

            echo "📥 Pulling latest image..."
            docker compose pull

            echo "🔄 Restarting containers..."
            docker compose up -d --force-recreate

            echo "⏳ Waiting for services to start..."
            sleep 15

            echo "🧹 Cleanup old images..."
            docker image prune -af

            echo "✅ Deployment complete!"
            echo ""
            echo "📊 Container Status:"
            docker compose ps

      - name: 🏥 Health Check
        run: |
          echo "Waiting for application to be ready..."
          sleep 10

          echo "Running health check..."
          if curl -f -m 10 http://${{ secrets.EC2_HOST }}:3000/api/health; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed!"
            exit 1
          fi

      - name: 📊 Deployment Summary
        if: success()
        run: |
          echo "## Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Successfully deployed to EC2!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** \`${{ secrets.EC2_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Git Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Health check passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Application is running" >> $GITHUB_STEP_SUMMARY
          echo "- Old Docker images cleaned up" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "::error::Deployment to EC2 failed"
          echo "## Deployment Failed ❌" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployment process failed. Check the logs above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Troubleshooting:**" >> $GITHUB_STEP_SUMMARY
          echo "- Check SSH connection to EC2" >> $GITHUB_STEP_SUMMARY
          echo "- Verify docker compose configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Check application logs on EC2" >> $GITHUB_STEP_SUMMARY
          echo "- Verify health endpoint is accessible" >> $GITHUB_STEP_SUMMARY
