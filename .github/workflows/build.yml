# Build and Push Docker Image (GHCR)
# ====================================
# Runs on every push to main. Does not require any deploy target to succeed —
# this only needs GHCR access, which is automatic via GITHUB_TOKEN.
name: Build and Push Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ✅ Validate Dockerfile before building
      - name: 🔍 Validate Dockerfile
        run: |
          echo "::group::Dockerfile Validation"

          if ! grep -q "FROM.*AS production" Dockerfile; then
            echo "::error::Production target not found in Dockerfile"
            exit 1
          fi

          if ! grep -A 10 "FROM.*AS production" Dockerfile | grep -q "EXPOSE 3000"; then
            echo "::warning::Production stage might be missing EXPOSE directive"
          fi

          if ! grep -A 20 "FROM.*AS production" Dockerfile | grep -q "HEALTHCHECK"; then
            echo "::warning::Production stage is missing HEALTHCHECK"
          fi

          echo "✅ Dockerfile validation passed"
          echo "::endgroup::"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Normalize image name (lowercase)
      - name: 🔤 Normalize image name
        id: image
        run: |
          echo "name=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=git-,format=short
            type=raw,value=prod-{{date 'YYYYMMDD-HHmmss'}},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Footloose Adventures API
            org.opencontainers.image.description=Node.js Express API for Footloose Adventures
            org.opencontainers.image.vendor=Footloose Adventures
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ssZ'}}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # NOTE: target architecture is Oracle Ampere A1 (ARM64). If you ever
      # deploy this image anywhere amd64 too, switch to:
      #   platforms: linux/amd64,linux/arm64
      # (multi-platform builds take noticeably longer).
      - name: 🏗️ Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            BUILDKIT_INLINE_CACHE=1
          provenance: false

      # ✅ Verify the built image
      - name: 🔬 Verify image
        run: |
          echo "::group::Image Verification"

          docker pull ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest

          echo "📦 Image size:"
          docker images ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest --format "{{.Size}}"

          echo "🏥 Healthcheck:"
          docker inspect ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest --format='{{json .Config.Healthcheck}}' | jq '.' || echo "No healthcheck"

          echo "✅ Image verification passed"
          echo "::endgroup::"

      - name: 📊 Build summary
        if: success()
        run: |
          echo "## Docker Build Summary 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** $(docker images ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest --format '{{.Size}}')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags Published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
